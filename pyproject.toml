[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garmentiq"
dynamic = ["version"]
authors = [
  { name="Li Yuan", email="lyuan@gd.edu.kg" },
  { name="Xinrui Zhai", email="zxr86272731@gmail.com" },
  { name="Fangzhou Ma", email="fangzhou.ma029@gmail.com" },
]
maintainers = [
  { name="Li Yuan", email="lyuan@gd.edu.kg" },
  { name="Xinrui Zhai", email="zxr86272731@gmail.com" },
  { name="Fangzhou Ma", email="fangzhou.ma029@gmail.com" },
]
description = "Automated Garment Measurement for Fashion Retail"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "garment measurement",
    "fashion",
    "apparel",
    "retail",
    "computer vision",
    "deep learning",
    "segmentation",
    "landmark detection",
    "image classification",
    "pytorch",
    "sam",
    "birefnet",
    "hrnet",
    "deit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
dependencies = [
    "requests>=2.30.0",
    "tqdm>=4.67.1",
    "pandas>=2.2.2",
    "numpy>=2.0.0,<3.0.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "scikit-learn>=1.6.1",
    "Pillow>=11.1.0",
    "matplotlib>=3.10.0",
    "transformers>=5.0.0",
    "kornia>=0.8.0",
    "timm>=1.0.15",
    "einops>=0.8.1",
    "safetensors>=0.7.0",
    "shapely>=2.1.1",
    "opencv-python>=4.11.0.86"
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
    "nbmake>=1.5.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

[project.urls]
Homepage = "https://garmentiq.ly.gd.edu.kg/"
Documentation = "https://garmentiq.ly.gd.edu.kg/documentation/"
Repository = "https://github.com/lygitdata/GarmentIQ"
Issues = "https://github.com/lygitdata/GarmentIQ/issues"
"Web Pipeline" = "https://garmentiq.ly.gd.edu.kg/application/"
Paper = "https://archive.gd.edu.kg/abs/20250525121523/"
Changelog = "https://github.com/lygitdata/GarmentIQ/releases"

[tool.setuptools.dynamic]
version = { attr = "garmentiq.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundled model configurations, plus the SAM 3 tokenizer vocabulary. `merges.txt` is
# not JSON, so it needs its own pattern or the shipped tokenizer would be incomplete.
"*" = ["**/*.json", "**/*.txt"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--nbmake"
